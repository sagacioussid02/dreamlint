[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamlint"
version = "0.1.0"
description = "Lint an AI assistant's memory folder — find outdated, duplicated, and contradicted notes, and propose a smaller, cleaner set."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sagacioussid02" }]
keywords = ["ai", "agents", "memory", "lint", "cli", "markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/sagacioussid02/dreamlint"

[project.scripts]
dreamlint = "dreamlint:main"

[tool.setuptools]
py-modules = ["dreamlint"]
